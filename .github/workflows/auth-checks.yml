name: Authentication checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  auth-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --input-type=module --check < "$file"; done
      - name: Test sign-in transitions
        run: node --test tests/*.test.cjs
